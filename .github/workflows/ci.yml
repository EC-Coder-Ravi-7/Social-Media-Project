name: SocialX CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  server-test-and-build:
    name: Backend Lint, Generate & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './Social Media App/server'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Social Media App/server/package-lock.json'

      - name: Install Server Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?sslmode=disable"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test?sslmode=disable"

      - name: Run Jest Test Suite
        run: npm test -- --testPathPattern=tests/validation.test.js
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key
          REDIS_URL: "redis://127.0.0.1:6379"

  client-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './Social Media App/client'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Social Media App/client/package-lock.json'

      - name: Install Client Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build
        env:
          CI: false

  docker-build-verification:
    name: Docker Image Build Validation
    needs: [server-test-and-build, client-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Mock Environment File
        run: |
          mkdir -p "./Social Media App/server"
          touch "./Social Media App/server/.env"
          echo "DATABASE_URL=postgresql://mock:mock@localhost:5432/mock" >> "./Social Media App/server/.env"
          echo "DIRECT_URL=postgresql://mock:mock@localhost:5432/mock" >> "./Social Media App/server/.env"
          echo "REDIS_URL=redis://localhost:6379" >> "./Social Media App/server/.env"
          echo "JWT_SECRET=mock_secret" >> "./Social Media App/server/.env"

      - name: Validate Docker Compose Configuration
        run: docker compose -f "./Social Media App/docker-compose.yml" config