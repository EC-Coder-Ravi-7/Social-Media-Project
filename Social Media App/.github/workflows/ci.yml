name: SocialX CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  server-test-and-build:
    name: Backend Lint, Generate & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Server Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://mock:mock@localhost:5432/mockdb' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://mock:mock@localhost:5432/mockdb' }}

      - name: Run Jest Test Suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379' }}

  client-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Client Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build
        env:
          CI: false

  docker-build-verification:
    name: Docker Image Build Validation
    needs: [server-test-and-build, client-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Container Images
        run: docker compose build